<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Alienta Rojinegro</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(4rem, 10vw, 7rem);
      font-weight: 800;
      color: var(--red-primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-inner" style="justify-content: center;">
      <a href="index.html" class="logo-link">
        <img src="assets/optimized/logos/LogoHorizontal.png" alt="Alienta Rojinegro" class="logo-img">
      </a>
    </div>
  </header>

  <main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">La sección que buscas no existe o ha sido movida. Regresa al catálogo para ver todos los productos disponibles.</p>
    <a href="index.html" class="btn btn-primary">VOLVER AL INICIO →</a>
  </main>
</body>
</html>
